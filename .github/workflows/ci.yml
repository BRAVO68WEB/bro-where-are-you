name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      flutter: ${{ steps.filter.outputs.flutter }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'server/**'
              - 'proto/**'
            web:
              - 'web/**'
            flutter:
              - 'mobile/**'
              - 'proto/**'
            proto:
              - 'proto/**'
              - 'server/pb/**'

  go-lint-build:
    name: Go Lint & Build
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: server

      - name: Build
        working-directory: server
        run: go build ./cmd/server

  web-typecheck-build:
    name: Web Typecheck & Build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm run build

  flutter-build:
    name: Flutter Build
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Mobile - Analyze & Test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test || true

      - name: Mobile - Build APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Wear - Analyze & Test
        working-directory: mobile/wear
        run: |
          flutter pub get
          flutter analyze
          flutter test || true

      - name: Wear - Build APK
        working-directory: mobile/wear
        run: flutter build apk --debug

  proto-verify:
    name: Proto Verify
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Regenerate proto
        run: |
          cd server && protoc --proto_path=../proto \
            --go_out=. --go_opt=module=bwhere \
            --go-grpc_out=. --go-grpc_opt=module=bwhere \
            location/v1/location.proto

      - name: Check for drift
        run: |
          git diff --exit-code server/pb/ || \
            (echo "::error::Generated proto files are out of date. Run 'make proto' and commit." && exit 1)
