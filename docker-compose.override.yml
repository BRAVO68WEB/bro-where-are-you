# =============================================================================
# docker-compose.override.yml — Local Development Overrides
# =============================================================================
# This file is automatically loaded by `docker compose up`.
# It exposes service ports to localhost for local development.
#
# For production, use: docker compose -f docker-compose.yml up -d
# =============================================================================

services:
  postgres:
    ports:
      - "5432:5432"

  hasura:
    ports:
      - "8080:8080"

  go-server:
    ports:
      - "50051:50051"
      - "8088:8088"

  web-app:
    # In dev, run the Vite dev server instead of nginx for hot reload
    build:
      context: ./web
      target: builder
      args:
        VITE_HASURA_URL: http://localhost:8080/v1/graphql
        VITE_HASURA_ADMIN_SECRET: ${VITE_HASURA_ADMIN_SECRET:-}
        VITE_API_URL: http://localhost:8088
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: http://localhost:3000/callback
        VITE_ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
        VITE_ONESIGNAL_SAFARI_WEB_ID: ${ONESIGNAL_SAFARI_WEB_ID:-}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    ports:
      - "3000:3000"

  valhalla:
    ports:
      - "8002:8002"
